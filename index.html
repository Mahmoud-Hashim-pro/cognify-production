    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#0F172A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="icon" type="image/svg+xml" href="/assets/icon.svg" />
    <link rel="apple-touch-icon" href="/assets/icon.svg" />

    <!-- JSON-LD Structured Data (Schema.org EducationalApplication & Accessibility) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Rafiqi",
        "alternateName": ["رفيقي", "Rafiqi AI"],
        "url": "https://rafiqi.vercel.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "inLanguage": ["ar", "en", "fr"],
        "description": "Rafiqi (رفيقي) is an AI-powered adaptive personal assistant and inclusive learning platform tailored to each learner's cognitive level, field, and accessibility needs.",
        "accessibilityControl": [
          "fullKeyboardControl",
          "fullMouseControl",
          "fullTouchControl",
          "fullVoiceControl"
        ],
        "accessibilityFeature": [
          "highContrastDisplay",
          "largePrint",
          "screenReader",
          "signLanguage",
          "captions",
          "audioDescription",
          "voiceControl"
        ],
        "accessibilityHazard": [
          "noFlashingHazard",
          "noMotionSimulationHazard"
        ],
        "creator": {
          "@type": "Organization",
          "name": "The Rafiqi Team"
        }
      }
    </script>

    <script>
      (function() {
        try {
          if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}

        // Register Service Worker for PWA mobile installability
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          var refreshing = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (!refreshing) {
              refreshing = true;
              window.location.reload();
            }
          });
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              reg.update();
            }).catch(function(err) {
              console.warn('[SW Registration Error]:', err);
            });
          });
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Rafiqi (رفيقي) — AI-Powered Adaptive Personal &amp; Accessibility Assistant requires JavaScript to run.</noscript>

  </body>
