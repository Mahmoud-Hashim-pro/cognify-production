    <!-- JSON-LD Structured Data (Schema.org EducationalApplication & Accessibility) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Rafiqi",
        "alternateName": ["رفيقي", "Rafiqi AI"],
        "url": "https://rafiqi-ai.vercel.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "inLanguage": ["ar", "en", "fr"],
        "description": "Rafiqi (رفيقي) is an AI-powered adaptive personal assistant and inclusive learning platform tailored to each learner's cognitive level, field, and accessibility needs.",
        "accessibilityControl": [
          "fullKeyboardControl",
          "fullMouseControl",
          "fullTouchControl",
          "fullVoiceControl"
        ],
        "accessibilityFeature": [
          "highContrastDisplay",
          "largePrint",
          "screenReader",
          "signLanguage",
          "captions",
          "audioDescription",
          "voiceControl"
        ],
        "accessibilityHazard": [
          "noFlashingHazard",
          "noMotionSimulationHazard"
        ],
        "creator": {
          "@type": "Organization",
          "name": "The Rafiqi Team"
        }
      }
    </script>

    <script>
      (function() {
        try {
          if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (_) {}

        // Register Service Worker for PWA mobile installability.
        // Updates are NEVER applied via a forced reload: a new worker waits and
        // the user confirms via a toast, so nobody ever downloads the site twice.
        if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
          var updateAccepted = false;
          navigator.serviceWorker.addEventListener('controllerchange', function() {
            if (updateAccepted) window.location.reload();
          });

          function showUpdateToast(worker) {
            if (document.getElementById('sw-update-toast')) return;
            var toast = document.createElement('div');
            toast.id = 'sw-update-toast';
            toast.setAttribute('role', 'status');
            toast.style.cssText = 'position:fixed;bottom:16px;left:16px;right:16px;max-width:420px;margin:0 auto;background:#1E293B;color:#F8FAFC;padding:12px 16px;border-radius:12px;display:flex;align-items:center;gap:12px;z-index:99999;font-family:ui-sans-serif,system-ui,sans-serif;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4)';
            var dir = document.documentElement.dir === 'rtl' ? 'rtl' : 'ltr';
            toast.dir = dir;
            var msg = document.createElement('span');
            msg.style.flex = '1';
            msg.textContent = dir === 'rtl' ? 'في نسخة جديدة من رفيقي. تحديث؟' : 'A new version of Rafiqi is available. Update?';
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.textContent = dir === 'rtl' ? 'تحديث' : 'Update';
            btn.style.cssText = 'background:#4B9FE1;color:#0F172A;border:0;border-radius:8px;padding:8px 16px;font-weight:700;cursor:pointer;min-height:44px';
            btn.addEventListener('click', function() {
              updateAccepted = true;
              worker.postMessage({ type: 'SKIP_WAITING' });
            });
            var dismiss = document.createElement('button');
            dismiss.type = 'button';
            dismiss.setAttribute('aria-label', dir === 'rtl' ? 'لاحقًا' : 'Later');
            dismiss.textContent = '\u00d7';
            dismiss.style.cssText = 'background:transparent;color:#94A3B8;border:0;font-size:20px;cursor:pointer;min-width:44px;min-height:44px';
            dismiss.addEventListener('click', function() { toast.remove(); });
            toast.appendChild(msg);
            toast.appendChild(btn);
            toast.appendChild(dismiss);
            document.body.appendChild(toast);
          }

          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').then(function(reg) {
              reg.update();
              if (reg.waiting && navigator.serviceWorker.controller) {
                showUpdateToast(reg.waiting);
              }
              reg.addEventListener('updatefound', function() {
                var worker = reg.installing;
                if (!worker) return;
                worker.addEventListener('statechange', function() {
                  if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                    showUpdateToast(worker);
                  }
                });
              });
            }).catch(function(err) {
              console.warn('[SW Registration Error]:', err);
            });
          });
        }
      })();
    </script>
  </head>
  <body>
    <noscript>Rafiqi (رفيقي) — AI-Powered Adaptive Personal &amp; Accessibility Assistant requires JavaScript to run.</noscript>

    <!-- Inline splash: paints instantly from raw HTML/CSS (before React boots),
         removed by main.tsx as soon as the app mounts. Mirrors the React splash
         (chosen concept "A": ripples from a gold dot revealing the wordmark).
         Honors reduced motion. -->
    <div id="rafiqi-inline-splash" aria-hidden="true">
      <div class="rafiqi-splash-glow"></div>
      <span class="rafiqi-splash-ring"></span>
      <span class="rafiqi-splash-ring rafiqi-splash-ring-2"></span>
      <span class="rafiqi-splash-ring rafiqi-splash-ring-3"></span>
      <span class="rafiqi-splash-word">Rafiqi</span>
    </div>
    <style>
      #rafiqi-inline-splash {
        position: fixed; inset: 0; z-index: 99998;
        display: flex; align-items: center; justify-content: center;
        background: #0F172A;
      }
      .rafiqi-splash-glow {
        position: absolute; width: 360px; height: 360px; border-radius: 50%;
        background: radial-gradient(circle, rgba(229,169,60,0.38) 0%, rgba(229,169,60,0.14) 42%, rgba(229,169,60,0) 70%);
        animation: rafiqi-glow-in 1.4s ease-out both;
      }
      .rafiqi-splash-ring {
        position: absolute; width: 170px; height: 170px; border-radius: 50%;
        border: 2px solid rgba(75,159,225,0.55); opacity: 0;
        animation: rafiqi-ripple 1.8s cubic-bezier(0.2, 0.6, 0.35, 1) both;
      }
      .rafiqi-splash-ring-2 { animation-delay: 0.45s; }
      .rafiqi-splash-ring-3 { animation-delay: 0.9s; }
      .rafiqi-splash-word {
        position: relative; color: #fff; font-weight: 900; letter-spacing: -0.025em;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: clamp(2.75rem, 9vw, 4rem); line-height: 1;
        animation: rafiqi-word-in 0.85s ease-out 0.2s both;
      }
      @keyframes rafiqi-ripple {
        0% { transform: scale(0.5); opacity: 0; }
        18% { opacity: 0.55; }
        100% { transform: scale(2.6); opacity: 0; }
      }
      @keyframes rafiqi-glow-in {
        0% { opacity: 0; transform: scale(0.75); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes rafiqi-word-in {
        0% { opacity: 0; transform: scale(0.94); }
        100% { opacity: 1; transform: scale(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .rafiqi-splash-glow, .rafiqi-splash-word { animation: none; }
        .rafiqi-splash-ring { animation: none; display: none; }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
